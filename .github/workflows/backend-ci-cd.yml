name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep each main merge validated while allowing stale PR runs to be replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-scraper:
    name: Test Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv --python 3.13
          source .venv/bin/activate
          uv pip install -e ./scraper
          uv pip install -r api/requirements.txt
          uv pip install pytest pytest-cov
          python -c "import pytest_cov; print('pytest-cov', pytest_cov.__version__)"
      - name: Run scraper tests with coverage
        working-directory: scraper
        run: |
          source ../.venv/bin/activate
          python -m pytest tests/ \
            --cov=sports_scraper \
            --cov-config=pyproject.toml \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage_html \
            --cov-fail-under=80

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv --python 3.13
          source .venv/bin/activate
          uv pip install -r api/requirements.txt
          uv pip install pytest pytest-cov pytest-asyncio pytest-timeout pip-audit
          python -c "import pytest_cov; print('pytest-cov', pytest_cov.__version__)"
      - name: Audit API dependencies
        working-directory: api
        run: |
          source ../.venv/bin/activate
          python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Run API tests with coverage
        working-directory: api
        env:
          PYTHONPATH: .
        run: |
          source ../.venv/bin/activate
          python -m pytest tests/ \
            --timeout=60 \
            --timeout-method=signal \
            --cov=app \
            --cov-config=pyproject.toml \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage_html \
            --cov-fail-under=80

  lint-ruff:
    name: Lint · Ruff (api + scraper)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Ruff
        run: |
          uv venv --python 3.13
          uv pip install ruff==0.8.6
      - name: Ruff check
        run: |
          source .venv/bin/activate
          ruff check api/app scraper/sports_scraper

  lint-web:
    name: Lint, type-check, test & coverage (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: web
        run: pnpm exec tsc --noEmit
      - name: Lint
        working-directory: web
        run: pnpm lint
      # Fails if coverage is below 90% (statements, branches, lines, functions); see web/vitest.config.ts coverage.thresholds
      - name: Unit tests + coverage (Vitest, ≥90% gates)
        working-directory: web
        run: pnpm run test:coverage
      - name: Upload web coverage report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: warn

  lint-no-swap-score:
    name: Lint · No _swap_score
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Ensure _swap_score is not re-introduced
        run: |
          if grep -r '_swap_score' api/ scraper/ --include='*.py' -l; then
            echo "ERROR: _swap_score found in Python sources. This helper was removed in ISSUE-016; use ScoreObject {home, away} instead."
            exit 1
          fi
          echo "OK: _swap_score not found."

  lint-camel-case-schemas:
    name: Lint · camelCase response schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check all Pydantic response models have camelCase aliases
        run: python scripts/lint_camel_case_schemas.py

  lint-router-namespaces:
    name: Lint · Router namespaces (/api/v1 vs /api/admin)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install API dependencies
        run: |
          uv venv --python 3.13
          uv pip install -r api/requirements.txt
      - name: Scan router registrations
        run: |
          source .venv/bin/activate
          python scripts/lint_router_namespaces.py

  lint-fk-ondelete:
    name: Lint · FK ondelete declarations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check all ForeignKey() calls declare ondelete=
        run: python scripts/lint_fk_ondelete.py

  lint-api-schema:
    name: Lint · camelCase fields in /api/v1/ OpenAPI schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install API dependencies
        run: |
          uv venv --python 3.13
          uv pip install -r api/requirements.txt
      - name: Dump OpenAPI schema and scan /api/v1/ response fields
        run: |
          source .venv/bin/activate
          python scripts/lint_openapi_camel_case.py

  lint-js-core-sync:
    name: Lint · js-core types sync with /api/v1/ schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install API dependencies
        run: |
          uv venv --python 3.13
          uv pip install -r api/requirements.txt
      - name: Check js-core types cover all /api/v1/ response fields
        run: |
          source .venv/bin/activate
          python scripts/check_js_core_sync.py

  security-bandit:
    name: Security · bandit (api + scraper)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install bandit
        run: pip install "bandit[toml]==1.7.9"
      - name: Run bandit on api/app
        run: |
          # -ll = fail only on medium+ severity. Config lives in api/pyproject.toml.
          bandit -r api/app -c api/pyproject.toml -ll
      - name: Run bandit on scraper/sports_scraper
        run: |
          bandit -r scraper/sports_scraper -c scraper/pyproject.toml -ll

  security-pip-audit:
    name: Security · pip-audit (api + scraper)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install deps and audit
        run: |
          uv venv --python 3.13
          source .venv/bin/activate
          uv pip install pip-audit
          uv pip install -r api/requirements.txt
          uv pip install -e ./scraper
          uv pip install --upgrade pip
          pip-audit --skip-editable

  security-pnpm-audit:
    name: Security · pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install and audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit

  security-detect-secrets:
    name: Security · detect-secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"
      - name: Verify no new secrets introduced
        run: |
          detect-secrets scan --baseline .secrets.baseline \
            --exclude-files '(^|/)(coverage_html|node_modules|\.venv|dist|build)(/|$)'

  security-sql-interpolation:
    name: Security · SQL interpolation audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Grep api/app for SQL string interpolation
        run: python scripts/lint_sql_interpolation.py

  lint-maintenance-mode:
    name: Guardrail · Maintenance-only workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install workflow parser
        run: pip install "PyYAML==6.0.3"
      - name: Test and enforce the maintenance boundary
        run: |
          python -m unittest tests.test_maintenance_mode_guardrail
          python scripts/check_maintenance_mode.py

  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - test-scraper
      - test-api
      - lint-ruff
      - lint-web
      - lint-no-swap-score
      - lint-camel-case-schemas
      - lint-router-namespaces
      - lint-api-schema
      - lint-fk-ondelete
      - lint-js-core-sync
      - security-bandit
      - security-pip-audit
      - security-pnpm-audit
      - security-detect-secrets
      - security-sql-interpolation
      - lint-maintenance-mode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: |
          uv venv --python 3.13
          uv pip install -r api/requirements.txt
          uv pip install -e ./scraper
      - name: Compile Python modules
        run: |
          source .venv/bin/activate
          python -m compileall api/app scraper/sports_scraper
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile web
        working-directory: web
        run: pnpm build

  build:
    name: Build Images (No Push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, scraper]
        include:
          - service: api
            dockerfile: infra/api.Dockerfile
          - service: web
            dockerfile: infra/web.Dockerfile
          - service: scraper
            dockerfile: infra/scraper.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: sports-data-admin-${{ matrix.service }}:ci
          # Per-service GHA cache scope avoids cross-image layer collisions
          # while still letting each image reuse its own previous layers.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
